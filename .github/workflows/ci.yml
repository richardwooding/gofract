name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build
        run: go build -o gofract ./cmd/gofract
      - name: Validate desktop integration files
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate assets/io.github.richardwooding.gofract.desktop
          appstreamcli validate --no-net assets/io.github.richardwooding.gofract.metainfo.xml
      - name: Package deb and rpm (smoke test)
        env:
          VERSION: 0.0.0
          ARCH: amd64
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          mkdir -p dist/gofract && cp gofract dist/gofract/
          nfpm package -f packaging/nfpm.yaml -p deb -t .
          nfpm package -f packaging/nfpm.yaml -p rpm -t .
          dpkg-deb -c gofract_*.deb > deb-contents.txt
          grep -q usr/bin/gofract deb-contents.txt
          sudo dpkg -i gofract_*.deb && gofract -version && gofract -list
      - name: Icon generator stays in sync
        run: |
          go run ./tools/mkicon /tmp/icons
          cmp /tmp/icons/icon-256.png assets/icon-256.png

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/gofract
      - name: App bundle and disk image
        if: runner.os == 'macOS'
        run: |
          packaging/macos/package.sh gofract ci gofract-ci.dmg
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/gofract-dmg gofract-ci.dmg
          ls -la /tmp/gofract-dmg
          /tmp/gofract-dmg/gofract.app/Contents/MacOS/gofract -version
          codesign --verify --deep --strict /tmp/gofract-dmg/gofract.app
          hdiutil detach /tmp/gofract-dmg

  snap:
    name: Snap builds and launches
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: snapcore/action-build@v1
        id: snap
      - name: Install and launch under confinement
        run: packaging/test-snap.sh "${{ steps.snap.outputs.snap }}"

  flathub:
    name: Flathub manifest builds and lints
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated module list matches go.sum
        run: |
          go install github.com/dennwc/flatpak-go-mod@latest
          # The tool moves vendor/modules.txt into its output directory, so
          # that directory must sit on the same filesystem as the checkout.
          mkdir -p .gomod-check && (cd .gomod-check && "$(go env GOPATH)/bin/flatpak-go-mod" ..)
          diff -u packaging/flathub/go.mod.yml .gomod-check/go.mod.yml
          diff -u packaging/flathub/modules.txt .gomod-check/modules.txt
          rm -rf .gomod-check vendor
      - name: Install flatpak-builder-lint
        run: flatpak install -y --noninteractive flathub org.flatpak.Builder
      - name: Lint manifest and metainfo
        # The linter runs flatpak-builder inside the org.flatpak.Builder
        # sandbox, which needs a writable state directory next to the
        # manifest; the bind-mounted checkout is not writable to it.
        run: |
          lint=$HOME/flathub-lint
          mkdir -p "$lint"
          cp packaging/flathub/io.github.richardwooding.gofract.yml packaging/flathub/go.mod.yml packaging/flathub/modules.txt "$lint/"
          cp assets/io.github.richardwooding.gofract.metainfo.xml "$lint/"
          chmod -R a+rwX "$lint"
          cd "$lint"
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.richardwooding.gofract.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream io.github.richardwooding.gofract.metainfo.xml
      - name: Build as Flathub would
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gofract-flathub.flatpak
          manifest-path: packaging/flathub/io.github.richardwooding.gofract.yml
          mirror-screenshots-url: https://dl.flathub.org/media
          cache: false
          upload-artifact: false
      - name: Commit mirrored screenshots as Flathub's builder does
        run: |
          ostree commit --repo=repo --canonical-permissions --branch=screenshots/x86_64 flatpak_app/files/share/app-info/media
      - name: Lint the built repository
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
